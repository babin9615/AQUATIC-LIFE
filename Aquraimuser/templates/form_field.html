<div class="mb-3">
  {% if f.field.widget.input_type == 'checkbox' %}
    <div class="form-check">{{ f }}<label class="form-check-label" for="{{ f.id_for_label }}">{{ f.label }}</label></div>
  {% else %}
    <label class="form-label fw-semibold" for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {{ f }}
  {% endif %}
  {% for e in f.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
  {% if f.help_text %}<div class="form-text">{{ f.help_text }}</div>{% endif %}
</div>
